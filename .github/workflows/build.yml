name: Build Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name FlowerDeliveries main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlowerDeliveries
          path: dist/FlowerDeliveries.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Доставки цветов v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/FlowerDeliveries.exe
