name: Build Windows exe

on:
  push:
    paths-ignore:  # правки описания и картинок не выпускают новую версию
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Stamp version
        shell: bash
        run: echo 'VERSION = "1.${{ github.run_number }}"' > app/version.py
      - name: Build exe
        # что выкинуто из сборки, чтобы быстрее открывалась, — в AloFlorist.spec
        run: python -m PyInstaller --noconfirm AloFlorist.spec
      - name: Self-test the exe
        # собранную программу запускаем на временной базе: окна, склад, фото, этикетки. Не прошла — версия не выходит
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 300 ./dist/AloFlorist.exe --selftest "$PWD/selftest.txt" || true
          cat selftest.txt
          head -1 selftest.txt | grep -qx OK
      - name: Copy under the old name
        shell: bash
        # Версии программы до переименования ищут в релизе файл FlowerDeliveries.exe — без копии они перестали бы обновляться.
        run: cp dist/AloFlorist.exe dist/FlowerDeliveries.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AloFlorist
          path: dist/AloFlorist.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: AloFlorist v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/AloFlorist.exe
            dist/FlowerDeliveries.exe
